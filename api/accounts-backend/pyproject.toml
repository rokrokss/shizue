[project]
name = "shizue-accounts-backend"
version = "0.1.0"
description = "Accounts Backend Service for Shizue"
requires-python = ">=3.12,<3.13"
dependencies = []  # 루트 workspace에서 관리

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[dependency-groups]
dev = [
    "black==25.1.0",
    "isort==5.13.2",
    "flake8==7.3.0",
    "mypy==1.17.1",
    "types-redis==4.6.0",
    "sqlalchemy-stubs==0.4",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "pytest-cov==6.2.1",
    "pytest-watch==4.2.0",
    "httpx==0.26.0",
    "bandit==1.7.6",
    "safety",
    "taskipy>=1.12.2",
]

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ["__pycache__", ".venv", "migrations"]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.taskipy.tasks]
# Development server
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
run = "uvicorn app.main:app --host 0.0.0.0 --port 8000"

# Code formatting
format = "isort app/ && black app/"
fmt = "task format"

# Linting and checks
lint = "flake8 app/ --max-line-length=120 --exclude=__pycache__"
mypy = "mypy app/ --ignore-missing-imports"
check-format = "isort --check-only app/ && black --check app/"
check = "task check-format && task lint"

# Testing
test = "pytest -v --cov=app --cov-report=xml --cov-report=term-missing"
test-watch = "pytest-watch -v"

# Database
migrate = "alembic upgrade head"
migrate-create = "alembic revision --autogenerate -m"
migrate-down = "alembic downgrade -1"

# Combined tasks
ci = "task check && task test"
all = "task format && task check && task test"
