version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: shizue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shizue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shizue_password}
      POSTGRES_DB: ${POSTGRES_DB:-shizue_accounts}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shizue}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: shizue-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shizue-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shizue}:${POSTGRES_PASSWORD:-shizue_password}@postgres:5432/${POSTGRES_DB:-shizue_accounts}

      # Redis
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis_password}@redis:6379/0

      # Application settings
      APP_NAME: "Shizue Accounts API"
      APP_VERSION: "1.0.0"
      DEBUG: "false"

      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}

      # Chrome Extension
      CHROME_EXTENSION_ID: ${CHROME_EXTENSION_ID}
      CHROME_EXTENSION_REDIRECT_URI: ${CHROME_EXTENSION_REDIRECT_URI}

      # CORS
      ALLOWED_ORIGINS: '["chrome-extension://${CHROME_EXTENSION_ID}","http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro  # Mount app directory for development

  # Nginx Reverse Proxy (optional for production)
  nginx:
    image: nginx:alpine
    container_name: shizue-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: shizue-network
