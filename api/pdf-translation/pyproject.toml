[project]
name = "shizue-pdf-translation"
version = "0.1.0"
description = "PDF Translation Service for Shizue"
requires-python = ">=3.12,<3.13"
dependencies = []  # 루트 workspace에서 관리

[dependency-groups]
dev = [
    "black==24.8.0",
    "isort==5.13.2",
    "flake8==7.0.0",
    "mypy==1.8.0",
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "httpx==0.26.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 120
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"