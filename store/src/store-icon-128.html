<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* 96x96 artwork + 16px transparent padding, per Chrome Web Store icon guidance.
     The 16-cell pixel grid lands on exactly 6px per cell. */
  html, body { margin: 0; background: transparent; }
  img { display: block; margin: 16px; width: 96px; height: 96px; image-rendering: pixelated; }
</style>
</head>
<body><img src="../../src/public/icon.svg"></body>
</html>
