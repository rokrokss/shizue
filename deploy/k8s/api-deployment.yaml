apiVersion: apps/v1
kind: Deployment
metadata:
  name: shizue-api
  namespace: shizue
  labels:
    app: shizue-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shizue-api
  template:
    metadata:
      labels:
        app: shizue-api
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for postgres; sleep 2; done;']
      - name: wait-for-redis
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z redis-service 6379; do echo waiting for redis; sleep 2; done;']
      - name: run-migrations
        image: shizue/shizue-accounts-api:latest
        imagePullPolicy: Always
        command: ['alembic', 'upgrade', 'head']
        envFrom:
        - configMapRef:
            name: shizue-api-config
        - secretRef:
            name: shizue-api-secrets
      containers:
      - name: api
        image: shizue/shizue-accounts-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: shizue-api-config
        - secretRef:
            name: shizue-api-secrets
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]

---
apiVersion: v1
kind: Service
metadata:
  name: shizue-api-service
  namespace: shizue
  labels:
    app: shizue-api
spec:
  selector:
    app: shizue-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      name: http
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shizue-api-hpa
  namespace: shizue
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shizue-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
