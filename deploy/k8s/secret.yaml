apiVersion: v1
kind: Secret
metadata:
  name: shizue-api-secrets
  namespace: shizue
type: Opaque
stringData:
  # Database credentials
  POSTGRES_USER: "shizue"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  DATABASE_URL: "postgresql+asyncpg://shizue:CHANGE_ME_IN_PRODUCTION@postgres-service:5432/shizue_accounts"

  # JWT Secret
  JWT_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_RANDOM_KEY"

  # Google OAuth
  GOOGLE_CLIENT_ID: "YOUR_GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "YOUR_GOOGLE_CLIENT_SECRET"
  GOOGLE_REDIRECT_URI: "https://api.shizue.app/v1/auth/callback/google"

  # Chrome Extension
  CHROME_EXTENSION_ID: "YOUR_CHROME_EXTENSION_ID"
  CHROME_EXTENSION_REDIRECT_URI: "chrome-extension://YOUR_CHROME_EXTENSION_ID/callback"

  # Sentry (optional)
  SENTRY_DSN: ""
