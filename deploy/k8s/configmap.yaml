apiVersion: v1
kind: ConfigMap
metadata:
  name: shizue-api-config
  namespace: shizue
data:
  APP_NAME: "Shizue Accounts API"
  APP_VERSION: "1.0.0"
  HOST: "0.0.0.0"
  PORT: "8000"
  DEBUG: "false"
  # Database
  POSTGRES_DB: "shizue_accounts"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  # JWT
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "30"
  # CORS
  ALLOWED_ORIGINS: '["chrome-extension://*"]'