name: Backend CI/CD

on:
  push:
    branches: [main, develop, feature/account-and-webapp]
    paths:
      - 'api/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop, feature/account-and-webapp]
    paths:
      - 'api/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: api

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
          POSTGRES_HOST_AUTH_METHOD: trust # Allow connections without password for CI
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            api/uv.lock
            api/pyproject.toml

      - name: Install dependencies
        run: |
          uv sync --all-groups

      - name: Check database connectivity
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
        run: |
          # Wait for PostgreSQL to be ready
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U test; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 1
          done

      - name: Initialize database
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          JWT_SECRET_KEY: test_secret_key_for_ci
          GOOGLE_CLIENT_ID: test_client_id
          GOOGLE_CLIENT_SECRET: test_client_secret
          GOOGLE_REDIRECT_URI: http://localhost:8000/v1/auth/callback/google
          CHROME_EXTENSION_ID: test_extension_id
          CHROME_EXTENSION_REDIRECT_URI: chrome-extension://test_extension_id/callback
          TESTING: true
        run: |
          cd accounts-backend
          # Create tables using the init script
          uv run python scripts/init_test_db.py
          cd ..

      - name: Run linting
        run: |
          # Check code formatting for accounts-backend
          uv run black --check --diff accounts-backend/app/ || (echo "::error::Code formatting issues found. Run 'black accounts-backend/app/' locally to fix." && exit 1)
          # Check import sorting for accounts-backend
          uv run isort --check-only --diff accounts-backend/app/ || (echo "::error::Import sorting issues found. Run 'isort accounts-backend/app/' locally to fix." && exit 1)
          # Run flake8 linting for accounts-backend
          uv run flake8 accounts-backend/app/ --max-line-length=120 --exclude=__pycache__

          # Check pdf-translation if it has Python files
          if [ -d "pdf-translation" ] && find pdf-translation -name "*.py" -type f | grep -q .; then
            uv run black --check --diff pdf-translation/ || true
            uv run isort --check-only --diff pdf-translation/ || true
            uv run flake8 pdf-translation/ --max-line-length=120 --exclude=__pycache__ || true
          fi

      - name: Run type checking
        run: |
          # Run mypy but don't fail the build on type errors (many false positives with SQLAlchemy/Pydantic)
          uv run mypy accounts-backend/app/ --ignore-missing-imports || true
          # Type check pdf-translation if it has type hints
          if [ -d "pdf-translation" ] && find pdf-translation -name "*.py" -type f | grep -q .; then
            uv run mypy pdf-translation/ --ignore-missing-imports || true
          fi

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          JWT_SECRET_KEY: test_secret_key_for_ci
          GOOGLE_CLIENT_ID: test_client_id
          GOOGLE_CLIENT_SECRET: test_client_secret
          GOOGLE_REDIRECT_URI: http://localhost:8000/v1/auth/callback/google
          CHROME_EXTENSION_ID: test_extension_id
          CHROME_EXTENSION_REDIRECT_URI: chrome-extension://test_extension_id/callback
          TESTING: true
          PYTHONPATH: /home/runner/work/shizue/shizue/api/accounts-backend
        run: |
          # Run tests for accounts-backend
          cd accounts-backend
          # Show test environment
          echo "Python version: $(uv run python --version)"
          echo "Working directory: $(pwd)"
          echo "Database URL: ${DATABASE_URL}"

          # Run tests with more detailed output on failure
          uv run pytest -v --cov=app --cov-report=xml --cov-report=term-missing --tb=short || {
            echo "Tests failed. Showing last 100 lines of test output:"
            exit 1
          }
          cd ..

          # Run tests for pdf-translation if they exist
          if [ -d "pdf-translation/tests" ]; then
            cd pdf-translation && uv run pytest -v --cov=. --cov-report=xml --cov-report=term-missing || true
            cd ..
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./api/accounts-backend/coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run security scan
        run: |
          # Scan for security issues in accounts-backend
          uv run bandit -r accounts-backend/app/ -f json -o accounts-backend-bandit-report.json || true
          # Scan pdf-translation
          if [ -d "pdf-translation" ] && find pdf-translation -name "*.py" -type f | grep -q .; then
            uv run bandit -r pdf-translation/ -f json -o pdf-translation-bandit-report.json || true
          fi
          # Check for known vulnerabilities
          uv run safety check --json || true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install uv for export
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            api/uv.lock
            api/pyproject.toml

      - name: Export requirements
        run: |
          uv export --no-hashes --no-dev --group accounts > accounts-backend/requirements.txt

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api/accounts-backend
          push: false
          tags: test-tag
          labels: test-label
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
