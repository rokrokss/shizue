name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'api/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'api/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: api

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: |
          uv sync --all-groups

      - name: Run linting
        run: |
          # Check code formatting for accounts-backend
          uv run black --check --diff accounts-backend/app/ || (echo "::error::Code formatting issues found. Run 'black accounts-backend/app/' locally to fix." && exit 1)
          # Check import sorting for accounts-backend
          uv run isort --check-only --diff accounts-backend/app/ || (echo "::error::Import sorting issues found. Run 'isort accounts-backend/app/' locally to fix." && exit 1)
          # Run flake8 linting for accounts-backend
          uv run flake8 accounts-backend/app/ --max-line-length=120 --exclude=__pycache__
          
          # Check pdf-translation if it has Python files
          if [ -d "pdf-translation" ] && find pdf-translation -name "*.py" -type f | grep -q .; then
            uv run black --check --diff pdf-translation/ || true
            uv run isort --check-only --diff pdf-translation/ || true
            uv run flake8 pdf-translation/ --max-line-length=120 --exclude=__pycache__ || true
          fi

      - name: Run type checking
        run: |
          uv run mypy accounts-backend/app/ --ignore-missing-imports
          # Type check pdf-translation if it has type hints
          if [ -d "pdf-translation" ] && find pdf-translation -name "*.py" -type f | grep -q .; then
            uv run mypy pdf-translation/ --ignore-missing-imports || true
          fi

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/1
          JWT_SECRET_KEY: test_secret_key_for_ci
          GOOGLE_CLIENT_ID: test_client_id
          GOOGLE_CLIENT_SECRET: test_client_secret
          GOOGLE_REDIRECT_URI: http://localhost:8000/v1/auth/callback/google
          CHROME_EXTENSION_ID: test_extension_id
          CHROME_EXTENSION_REDIRECT_URI: chrome-extension://test_extension_id/callback
          TESTING: true
        run: |
          # Run tests for accounts-backend
          cd accounts-backend && uv run pytest -v --cov=app --cov-report=xml --cov-report=term-missing
          cd ..
          
          # Run tests for pdf-translation if they exist
          if [ -d "pdf-translation/tests" ]; then
            cd pdf-translation && uv run pytest -v --cov=. --cov-report=xml --cov-report=term-missing || true
            cd ..
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./api/accounts-backend/coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run security scan
        run: |
          # Scan for security issues in accounts-backend
          uv run bandit -r accounts-backend/app/ -f json -o accounts-backend-bandit-report.json || true
          # Scan pdf-translation
          if [ -d "pdf-translation" ] && find pdf-translation -name "*.py" -type f | grep -q .; then
            uv run bandit -r pdf-translation/ -f json -o pdf-translation-bandit-report.json || true
          fi
          # Check for known vulnerabilities
          uv run safety check --json || true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/shizue-accounts-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api/accounts-backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
