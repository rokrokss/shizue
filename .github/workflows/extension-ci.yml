name: Chrome Extension CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'wxt.config.ts'
      - '.github/workflows/extension-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'wxt.config.ts'
      - '.github/workflows/extension-ci.yml'

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checking
        run: pnpm compile

      - name: Run linting
        run: |
          # Add linting commands when ESLint is configured
          # pnpm lint
          echo "Linting skipped - configure ESLint"

      - name: Run tests
        run: |
          # Add test commands when tests are configured
          # pnpm test
          echo "Tests skipped - configure test framework"

      - name: Build extension
        run: pnpm build

      - name: Check build output
        run: |
          if [ ! -d "dist/chrome-mv3" ]; then
            echo "Build failed: dist/chrome-mv3 directory not found"
            exit 1
          fi

          # Check manifest
          if [ ! -f "dist/chrome-mv3/manifest.json" ]; then
            echo "Build failed: manifest.json not found"
            exit 1
          fi

      # - name: Upload build artifacts
      #   uses: actions/upload-artifact@v3
      #   with:
      #     name: chrome-extension-${{ matrix.node-version }}
      #     path: dist/chrome-mv3/

  package:
    name: Package Extension
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm build

      - name: Create ZIP package
        run: pnpm zip

      # - name: Upload ZIP artifact
      #   uses: actions/upload-artifact@v3
      #   with:
      #     name: shizue-extension-${{ github.sha }}
      #     path: shizue-chrome-extension*.zip

