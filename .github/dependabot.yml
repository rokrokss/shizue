version: 2
updates:
  # Python dependencies for backend
  - package-ecosystem: "pip"
    directory: "/api/accounts-backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "pizzaman"
    labels:
      - "dependencies"
      - "backend"
    groups:
      python-dev:
        patterns:
          - "pytest*"
          - "black"
          - "flake8"
          - "mypy"
      python-security:
        patterns:
          - "bandit"
          - "safety"
    commit-message:
      prefix: "chore"
      include: "scope"

  # JavaScript dependencies for Chrome Extension
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "pizzaman"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
      wxt:
        patterns:
          - "wxt*"
          - "@wxt-dev/*"
      dev-tools:
        patterns:
          - "typescript"
          - "tailwindcss"
          - "vite*"
    ignore:
      # Ignore major version updates for critical dependencies
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "wxt"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    reviewers:
      - "pizzaman"
    labels:
      - "dependencies"
      - "ci/cd"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/api/accounts-backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    reviewers:
      - "pizzaman"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"