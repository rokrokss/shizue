# Codecov configuration
# Documentation: https://docs.codecov.io/docs/codecov-yaml

coverage:
  # Overall project coverage settings
  status:
    project:
      default:
        target: 40%           # Target coverage for the entire project
        threshold: 5%         # Allow coverage to drop by 5% and still pass
        base: auto           # Compare against base branch
        if_not_found: success # Pass if coverage data not found
        if_ci_failed: error  # Fail if CI fails

    # Patch coverage settings (for PR changes)
    patch:
      default:
        target: 20%          # Lower target for patch coverage (was 27.94%)
        threshold: 10%       # Allow more flexibility
        base: auto
        only_pulls: true     # Only check on pull requests
        if_not_found: success # Don't fail if no coverage data

# Files to ignore in coverage reports
ignore:
  - "tests/**"               # All test files
  - "**/test_*.py"          # Test files pattern
  - "**/*_test.py"          # Alternative test pattern
  - "**/conftest.py"        # Pytest configuration
  - "scripts/**"            # Utility scripts
  - "docs/**"               # Documentation
  - "migrations/**"         # Database migrations
  - "**/__pycache__/**"     # Python cache
  - "**/node_modules/**"    # Node modules
  - "dist/**"               # Build output
  - "build/**"              # Build files
  - "*.config.js"           # Config files
  - "*.config.ts"           # TypeScript configs

# Comment settings for PRs
comment:
  layout: "reach,diff,flags,tree"
  behavior: default          # Comment on PRs
  require_changes: true      # Only comment when coverage changes
  require_base: false        # Don't require base coverage
  require_head: true         # Require head coverage
  branches: null            # Comment on all branches

# Coverage precision
coverage:
  precision: 2              # Round to 2 decimal places
  round: down              # Round down
  range: "40...80"         # Color code: red < 40%, yellow 40-80%, green > 80%

# Flag configuration for different test suites
flags:
  backend:
    paths:
      - api/accounts-backend/**
    carryforward: true
  extension:
    paths:
      - src/**
    carryforward: true
  webapp:
    paths:
      - webapp/**
    carryforward: true
